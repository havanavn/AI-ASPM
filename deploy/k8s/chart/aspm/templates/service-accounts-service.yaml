{{- $model := include "aspm.model" . | fromJson -}}
{{- range $name, $unit := $model.units }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aspm.fullname" $ }}-{{ $name }}
  labels:
    {{- include "aspm.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  {{- if or (eq $.Values.secrets.provider "awssm") (eq $.Values.secrets.provider "gcpsm") (eq $.Values.secrets.provider "azkv") }}
  annotations:
    {{- if eq $.Values.secrets.provider "awssm" }}
    eks.amazonaws.com/role-arn: {{ $.Values.secrets.awssm.roleArn | quote }}
    {{- else if eq $.Values.secrets.provider "azkv" }}
    azure.workload.identity/client-id: {{ $.Values.secrets.azkv.clientId | quote }}
    {{- end }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aspm.fullname" . }}-migrate
  labels:
    {{- include "aspm.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
---
# Only the application tier is addressable. The worker serves the same HTTP surface for its probes,
# and no Service points at it: nothing in the cluster has a reason to call a worker.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aspm.fullname" . }}-app
  labels:
    {{- include "aspm.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  selector:
    {{- include "aspm.unitLabels" (dict "root" . "unit" "app") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
