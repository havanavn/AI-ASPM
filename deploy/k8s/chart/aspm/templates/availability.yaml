{{- /* PodDisruptionBudgets for both units; an HPA for the application tier. */ -}}
{{- $model := include "aspm.model" . | fromJson -}}
{{- range $name, $unit := $model.units }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aspm.fullname" $ }}-{{ $name }}
  labels:
    {{- include "aspm.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  minAvailable: {{ (index $.Values.podDisruptionBudget $name).minAvailable }}
  selector:
    matchLabels:
      {{- include "aspm.unitLabels" (dict "root" $ "unit" $name) | nindent 6 }}
{{- end }}
{{- if .Values.autoscaling.app.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "aspm.fullname" . }}-app
  labels:
    {{- include "aspm.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "aspm.fullname" . }}-app
  minReplicas: {{ .Values.autoscaling.app.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.app.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.app.targetCPUUtilizationPercentage }}
{{- end }}
