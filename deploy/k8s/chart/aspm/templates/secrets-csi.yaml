{{- /*
OPTION: fill the secrets mount from an enterprise store through the Secrets Store CSI driver instead
of a Kubernetes Secret. One SecretProviderClass per provider kind; the application still reads files
under the same mount and does not know which produced them (ADR-052: the contract is the decision,
the provider is configuration). The application's OWN provider adapters (vault/azkv/awssm/gcpsm) are
for tenant-entered secrets at runtime; this class is for the deployment's bootstrap secrets.
*/ -}}
{{- if .Values.secrets.csi.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secrets.csi.providerClassName }}
  labels:
    {{- include "aspm.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.secrets.provider "vault" }}
  provider: vault
  parameters:
    vaultAddress: {{ .Values.secrets.vault.address | quote }}
    roleName: {{ .Values.secrets.vault.kubernetesRole | quote }}
    {{- if .Values.secrets.vault.namespace }}
    vaultNamespace: {{ .Values.secrets.vault.namespace | quote }}
    {{- end }}
    objects: |
      - objectName: {{ .Values.postgres.appPasswordKey }}
        secretPath: {{ .Values.secrets.vault.mount }}/data/deployment/database
        secretKey: app_password
      - objectName: {{ .Values.postgres.migratePasswordKey }}
        secretPath: {{ .Values.secrets.vault.mount }}/data/deployment/database
        secretKey: migrate_password
      - objectName: {{ .Values.postgres.verifyPasswordKey }}
        secretPath: {{ .Values.secrets.vault.mount }}/data/deployment/database
        secretKey: verify_password
      - objectName: {{ .Values.objectStore.userKey }}
        secretPath: {{ .Values.secrets.vault.mount }}/data/deployment/objectstore
        secretKey: user
      - objectName: {{ .Values.objectStore.passwordKey }}
        secretPath: {{ .Values.secrets.vault.mount }}/data/deployment/objectstore
        secretKey: password
      - objectName: credential-key
        secretPath: {{ .Values.secrets.vault.mount }}/data/deployment/sealing
        secretKey: key
      - objectName: {{ .Values.bootstrapPasswordKey }}
        secretPath: {{ .Values.secrets.vault.mount }}/data/deployment/bootstrap
        secretKey: password
  {{- else if eq .Values.secrets.provider "azkv" }}
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.secrets.azkv.clientId | quote }}
    keyvaultName: {{ .Values.secrets.azkv.vaultName | quote }}
    tenantId: {{ .Values.secrets.azkv.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: aspm-deploy-{{ .Values.postgres.appPasswordKey }}
          objectAlias: {{ .Values.postgres.appPasswordKey }}
          objectType: secret
        - |
          objectName: aspm-deploy-{{ .Values.postgres.migratePasswordKey }}
          objectAlias: {{ .Values.postgres.migratePasswordKey }}
          objectType: secret
        - |
          objectName: aspm-deploy-{{ .Values.postgres.verifyPasswordKey }}
          objectAlias: {{ .Values.postgres.verifyPasswordKey }}
          objectType: secret
        - |
          objectName: aspm-deploy-{{ .Values.objectStore.userKey }}
          objectAlias: {{ .Values.objectStore.userKey }}
          objectType: secret
        - |
          objectName: aspm-deploy-{{ .Values.objectStore.passwordKey }}
          objectAlias: {{ .Values.objectStore.passwordKey }}
          objectType: secret
        - |
          objectName: aspm-deploy-credential-key
          objectAlias: credential-key
          objectType: secret
        - |
          objectName: aspm-deploy-{{ .Values.bootstrapPasswordKey }}
          objectAlias: {{ .Values.bootstrapPasswordKey }}
          objectType: secret
  {{- else if eq .Values.secrets.provider "awssm" }}
  provider: aws
  parameters:
    region: {{ .Values.secrets.awssm.region | quote }}
    objects: |
      - objectName: aspm/deployment/{{ .Values.postgres.appPasswordKey }}
        objectAlias: {{ .Values.postgres.appPasswordKey }}
      - objectName: aspm/deployment/{{ .Values.postgres.migratePasswordKey }}
        objectAlias: {{ .Values.postgres.migratePasswordKey }}
      - objectName: aspm/deployment/{{ .Values.postgres.verifyPasswordKey }}
        objectAlias: {{ .Values.postgres.verifyPasswordKey }}
      - objectName: aspm/deployment/{{ .Values.objectStore.userKey }}
        objectAlias: {{ .Values.objectStore.userKey }}
      - objectName: aspm/deployment/{{ .Values.objectStore.passwordKey }}
        objectAlias: {{ .Values.objectStore.passwordKey }}
      - objectName: aspm/deployment/credential-key
        objectAlias: credential-key
      - objectName: aspm/deployment/{{ .Values.bootstrapPasswordKey }}
        objectAlias: {{ .Values.bootstrapPasswordKey }}
  {{- else if eq .Values.secrets.provider "gcpsm" }}
  provider: gcp
  parameters:
    secrets: |
      - resourceName: projects/{{ .Values.secrets.gcpsm.project }}/secrets/aspm-deploy-db-app-password/versions/latest
        path: {{ .Values.postgres.appPasswordKey }}
      - resourceName: projects/{{ .Values.secrets.gcpsm.project }}/secrets/aspm-deploy-db-migrate-password/versions/latest
        path: {{ .Values.postgres.migratePasswordKey }}
      - resourceName: projects/{{ .Values.secrets.gcpsm.project }}/secrets/aspm-deploy-db-verify-password/versions/latest
        path: {{ .Values.postgres.verifyPasswordKey }}
      - resourceName: projects/{{ .Values.secrets.gcpsm.project }}/secrets/aspm-deploy-objectstore-user/versions/latest
        path: {{ .Values.objectStore.userKey }}
      - resourceName: projects/{{ .Values.secrets.gcpsm.project }}/secrets/aspm-deploy-objectstore-password/versions/latest
        path: {{ .Values.objectStore.passwordKey }}
      - resourceName: projects/{{ .Values.secrets.gcpsm.project }}/secrets/aspm-deploy-credential-key/versions/latest
        path: credential-key
      - resourceName: projects/{{ .Values.secrets.gcpsm.project }}/secrets/aspm-deploy-bootstrap-password/versions/latest
        path: {{ .Values.bootstrapPasswordKey }}
  {{- else }}
  {{- fail "secrets.csi.enabled requires secrets.provider to be vault, azkv, awssm or gcpsm" }}
  {{- end }}
{{- end }}
