# AI-ASPM — local deployment of the data tier.
#
# WHAT THIS STANDS UP: the operational store (ADR-049), the shared cache (ADR-055), and object
# storage (ADR-056), plus a one-shot job that applies V001 to V013.
#
# WHAT IT DOES NOT STAND UP: an application tier. There is no HTTP service in this repository yet
# — no entrypoint, no server, and OperationRegistry holds zero operations. See deploy/README.md,
# which states that plainly rather than leaving you to discover it from a container that exits.
#
# ---------------------------------------------------------------------------------------------
# OPS-DEP-009 IS ENFORCED BY THIS FILE, not merely described by it.
#
# "The three bypass credentials MUST NOT be present in any runtime environment reachable by
# application code." Its rationale: credential separation is what makes bypass unreachability
# structural rather than procedural.
#
# So each login role appears in EXACTLY ONE service's environment:
#   aspm_app      -> (the app tier, when it exists). Row-level security enforced.
#   aspm_migrate  -> the `migrate` service only. Runs and exits; not a runtime unit.
#   aspm_verify   -> the `verify` profile only. Read-only.
#   offboarding_executor has NO login user at all — it is dual-control gated (OPS-DEP-022) and
#   granting it a password here would put the platform's deletion capability in a compose file.
#
# Adding one of these to another service is the defect. It is visible in a diff of this file,
# which is the point of putting it here rather than in a startup script.
# ---------------------------------------------------------------------------------------------

name: aspm

services:

  # -------------------------------------------------------------------------------------------
  # ADR-049. PostgreSQL 18 is the FLOOR, not a preference: uuidv7() is native from 18 and the
  # migrations use it for time-ordered primary keys (CON-DAT-006). On 17 or earlier every
  # migration fails at the first DEFAULT. The verification suite works around it with a
  # documented test-only shim; a deployment does not get that shim.
  #
  # ADR-049's disqualifying constraint is row-level security with FORCE. It is satisfied by an
  # engine setting rather than by a convention, which is why CON-DAT-012 is testable by a query.
  # -------------------------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    # OPS-DEP-028 requires pinning by digest, "because a tag can be reassigned to different
    # content, so tag-based pinning is not pinning". A tag is used here because this file is for
    # local development; a deployment pins the digest and rebuilds on a cadence.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aspm}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-aspm_owner}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set it in .env — see .env.example}
      # Deterministic collation. A collation change reorders every text index, and keyset
      # pagination (PRD-API-006) depends on a stable total order.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
      APP_PASSWORD: ${APP_PASSWORD:?set it in .env}
      MIGRATE_PASSWORD: ${MIGRATE_PASSWORD:?set it in .env}
      VERIFY_PASSWORD: ${VERIFY_PASSWORD:?set it in .env}
    volumes:
      # PostgreSQL 18 images changed the layout: the mount goes at /var/lib/postgresql and the
      # server places its data in a major-version subdirectory, so pg_upgrade --link can run
      # without crossing a mount boundary. Mounting /var/lib/postgresql/data as on 17 and earlier
      # makes the container refuse to start with "unused mount/volume".
      - postgres-data:/var/lib/postgresql
      - ./postgres/01-login-roles.sh:/docker-entrypoint-initdb.d/01-login-roles.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # OPS-DEP-008 keeps readiness and liveness separate. Compose has one probe, so this is
      # readiness: it gates dependent services and does not restart the container.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-aspm_owner} -d ${POSTGRES_DB:-aspm}"]
      interval: 3s
      timeout: 3s
      retries: 20
    command:
      - postgres
      # Logging every statement is a local-development choice and would be wrong in production:
      # DOC-14 requires audit events, and a statement log is not one — it also captures parameter
      # values, which for this platform means evidence content and secrets.
      - -c
      - log_min_duration_statement=500

  # -------------------------------------------------------------------------------------------
  # Applies V001 to V013 in order, then exits. This is the migration pipeline of DOC-15 section
  # 9.1, reduced to one step.
  #
  # It is the ONLY service holding migration_runner, and it holds it because migrations run with
  # row-level enforcement bypassed — OPS-DEP-031 calls them "the highest-risk operation in the
  # platform" for exactly that reason.
  # -------------------------------------------------------------------------------------------
  migrate:
    image: postgres:18-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-aspm}
      PGUSER: aspm_migrate
      PGPASSWORD: ${MIGRATE_PASSWORD:?set it in .env}
    volumes:
      - ../src:/src:ro
      - ./migrate/apply.sh:/apply.sh:ro
    entrypoint: ["/bin/sh", "/apply.sh"]
    restart: "no"

  # -------------------------------------------------------------------------------------------
  # The application tier. ADR-057, ADR-003.
  #
  # Holds aspm_app and ONLY aspm_app — the credential that does NOT bypass row-level security. That
  # is OPS-DEP-009 as a property of this file: there is no bypass credential in this environment,
  # so no code path in this container can reach one however it is written.
  #
  # Build the distribution first (container egress is blocked here, so Gradle runs on the host):
  #     cd src && ./gradlew :app:installDist && cp -r app/build/install/app ../deploy/app/install
  # -------------------------------------------------------------------------------------------
  app:
    build:
      context: ./app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      objectstore:
        condition: service_healthy
    environment:
      ASPM_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aspm}
      ASPM_DB_USER: aspm_app
      ASPM_DB_PASSWORD: ${APP_PASSWORD:?set it in .env}
      ASPM_PORT: "8080"
      # The archive of submitted bills of materials. Without it a snapshot cannot be re-scanned
      # against a newer vulnerability database later, so a repository that stopped building would
      # keep its advisory data frozen — including for CVEs published after its last push.
      ASPM_OBJECTSTORE_ENDPOINT: http://objectstore:9000
      ASPM_OBJECTSTORE_USER: ${OBJECTSTORE_USER:-aspm_objectstore}
      ASPM_OBJECTSTORE_PASSWORD: ${OBJECTSTORE_PASSWORD:?set it in .env}
      # ⚠ The largest gap in the running system. Header-supplied identity is not authentication:
      # ADR-004 requires OIDC for humans and sender-constrained credentials for services, and
      # SEC-TEN-004 forbids a tenant derived from a header. DevPrincipalResolver REFUSES to
      # construct unless ASPM_ENVIRONMENT is exactly 'development', so this pair cannot be lifted
      # into a production deployment by copying the file — the server fails to start instead.
      ASPM_ENVIRONMENT: "development"
      ASPM_TENANT_ID: "11111111-1111-1111-1111-111111111111"
      # Test-credential custody (V033). Absent means the platform REFUSES a password rather
      # than storing one in the clear — see CredentialCustody. Generate: openssl rand -base64 32
      ASPM_CREDENTIAL_KEY: ${ASPM_CREDENTIAL_KEY:-}
      # ADR-059's credential bootstrap. It only ever fills a gap — a principal with a live credential
      # is skipped — and every principal it touches must change the password at first sign-in, because
      # the value came from an environment variable and OPS-DEP-020 treats that as exposed.
      ASPM_BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?set it in .env}
      # The development header resolver is now OFF. The session resolver is the default, so the login
      # flow is the only way in. Set ASPM_DEV_AUTH=true to restore header identity for API testing.
      ASPM_DEV_AUTH: "${ASPM_DEV_AUTH:-false}"
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      # Readiness, not liveness. OPS-DEP-008 keeps them separate and compose has one probe, so the
      # one it gets is the one that must fail when the operational store is unreachable.
      # bash's /dev/tcp rather than curl: the runtime image is a JRE and has no HTTP client, and
      # adding one to reach a health endpoint would widen the image of the tier that holds tenant
      # data for the sake of a probe.
      # bash -c, not CMD-SHELL: CMD-SHELL runs /bin/sh, which is dash here, and /dev/tcp is a bash
      # feature. The probe reported "Directory nonexistent" — a message that reads like a missing
      # file rather than a missing shell feature, which is why this is spelled out.
      #
      # bash's /dev/tcp rather than curl: the runtime image is a JRE with no HTTP client, and adding
      # one to reach a health endpoint would widen the image of the tier holding tenant data for the
      # sake of a probe.
      test: ["CMD", "bash", "-c",
             "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /internal/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 12

  # -------------------------------------------------------------------------------------------
  # ADR-055. Valkey as the shared cache, two-tier.
  #
  # ADR-055 records that cross-tenant key isolation here is an APPLICATION-layer control, and the
  # five highest-risk surfaces name cache key construction as "the recurring failure point in
  # otherwise correctly isolated systems". The engine cannot enforce it; nothing in this file
  # makes that better, and the container is here so the control has something to be tested
  # against rather than mocked.
  # -------------------------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${VALKEY_PASSWORD:?set it in .env}
      # No persistence. The cache holds tenant-derived data and a persisted cache is a copy of it
      # outside the encryption and erasure paths (SEC-TEN-016, ADR-034 on demonstrable deletion).
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$VALKEY_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set it in .env}

  # -------------------------------------------------------------------------------------------
  # ADR-056. S3-compatible object storage.
  #
  # OPS-DEP-016: "Object storage serving uploaded content MUST be a DISTINCT ORIGIN from the API
  # and web tiers." Evidence handling is the fourth highest-risk surface — content that is
  # expected to be malicious and must remain retrievable. Served from the application origin it
  # executes with the session; served from here it executes with nothing.
  #
  # The distinct port below is the local stand-in for a distinct origin. It is NOT equivalent: a
  # different port on the same host is same-site for cookies. A deployment uses a separate
  # registrable domain, which is what ServingOrigin.assertDistinctFrom checks.
  # -------------------------------------------------------------------------------------------
  objectstore:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECTSTORE_USER:-aspm_objectstore}
      MINIO_ROOT_PASSWORD: ${OBJECTSTORE_PASSWORD:?set it in .env}
      # Uploaded content is served as an attachment with the type enforced (OPS-DEP-016).
      # Enforcement is per-bucket policy, applied by the objectstore-init job below.
    volumes:
      - objectstore-data:/data
    ports:
      - "${OBJECTSTORE_PORT:-9000}:9000"
      - "${OBJECTSTORE_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # -------------------------------------------------------------------------------------------
  # Creates the buckets. Separate from the store so bucket policy is a reviewable artifact rather
  # than a manual step somebody performs once and nobody repeats in the next environment.
  # -------------------------------------------------------------------------------------------
  objectstore-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      objectstore:
        condition: service_healthy
    environment:
      OBJECTSTORE_USER: ${OBJECTSTORE_USER:-aspm_objectstore}
      OBJECTSTORE_PASSWORD: ${OBJECTSTORE_PASSWORD:?set it in .env}
    entrypoint: >
      /bin/sh -c "
      mc alias set store http://objectstore:9000 $$OBJECTSTORE_USER $$OBJECTSTORE_PASSWORD &&
      mc mb --ignore-existing store/aspm-evidence &&
      mc mb --ignore-existing store/aspm-export &&
      mc anonymous set none store/aspm-evidence &&
      mc anonymous set none store/aspm-export &&
      echo 'buckets ready: aspm-evidence, aspm-export (no anonymous access)'
      "
    restart: "no"

  # -------------------------------------------------------------------------------------------
  # OPTIONAL: runs the verification suite against THIS engine rather than the embedded one.
  #
  #   docker compose --profile verify run --rm verify
  #
  # Worth doing once: the embedded engine is 17.5 with a uuidv7 shim, and this is a real 18. The
  # one claim the shim leaves unverified — native uuidv7 monotonicity and time-ordering — is
  # verified here and nowhere else.
  #
  # Holds integrity_verifier, which is read-only and bypasses row-level security. It is in this
  # profile and in no other service.
  # -------------------------------------------------------------------------------------------
  # -------------------------------------------------------------------------------------------
  # Post-deployment conformance. DOC-15 section 5.1's "verification job".
  #
  #   docker compose --profile verify run --rm conformance
  #
  # Runs as integrity_verifier — BYPASSRLS and read-only, which is exactly what the cross-tenant
  # assertion of SEC-TEN-047 needs: it must see across tenants to assert that nothing else can.
  #
  # This is NOT the test suite. :kernel-verification creates and drops schema and switches between
  # all four roles; that needs authority no deployed environment should hand a running job, and an
  # earlier version of this file pointed it at the deployed database and failed correctly because
  # integrity_verifier cannot create a table. The suite asks whether the schema is correct and
  # belongs to the build. This asks whether the schema that got DEPLOYED is the one that was
  # verified, and it is the only place native uuidv7() is checked at all.
  # -------------------------------------------------------------------------------------------
  conformance:
    profiles: ["verify"]
    image: postgres:18-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-aspm}
      PGUSER: aspm_verify
      PGPASSWORD: ${VERIFY_PASSWORD:?set it in .env}
    volumes:
      - ./verify/conformance.sql:/conformance.sql:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "--no-psqlrc", "-f", "/conformance.sql"]
    restart: "no"

# ---------------------------------------------------------------------------------------------
# The network, pinned rather than left to Docker.
#
# Docker allocates the next free subnet from its default pool, which was 172.18.0.0/16 here. That
# is invisible until something else claims the same range — and on this machine Cloudflare WARP
# did: `ip route get 172.18.0.5` resolved via the CloudflareWARP interface, so docker-proxy
# accepted the TCP connection on the published port and then could not reach the container.
#
# The symptom is worth recording because it does not look like a network fault: connect() succeeds,
# so a port scan says the service is up, and the connection is reset only once bytes are relayed.
# From inside the container everything works. It reads as an application defect and is not one.
#
# 192.168.0.0/16 is in WARP's default exclusion list, so a subnet inside it is reachable without
# asking anyone to reconfigure or restart their VPN. Pinning it also makes the address deterministic:
# an unpinned network is re-allocated on every recreate, so the same collision can reappear later
# with a different range and no change to this file.
#
# If this subnet collides with your LAN, change it here — and prefer a range your VPN already
# excludes over one you have to add, because an exclusion added at runtime needs a reconnect.
# ---------------------------------------------------------------------------------------------

  # -------------------------------------------------------------------------------------------
  # The scheduled re-scan worker: Trivy plus a ticker.
  #
  # WHY IT EXISTS. Without it a component's advisory list only ever changed when a pipeline
  # re-pushed — so a repository that stopped building kept its vulnerability picture frozen, and a
  # CVE published after its last push was invisible for ever. That is the false negative this
  # product exists to find in other people's software.
  #
  # IT IS A CLIENT, NOT A COMPONENT. It authenticates with an ordinary signed ingestion credential
  # (ADR-004) issued at Access -> Integrations, holds ONE permission, and never touches the object
  # store — the document arrives in the response. A compromised scanner cannot read the archive of
  # every bill of materials the group has submitted.
  #
  # THE SCHEDULE IS NOT HERE. It is data, set in the dashboard: this ticks and asks. A crontab is
  # invisible to the person with the permission to change it.
  #
  # PROFILE. Off by default — it needs a credential a human must issue first, and a container that
  # crash-loops on a missing secret is a worse first impression than one that is not running.
  #   docker compose --profile scan up -d scanner
  # -------------------------------------------------------------------------------------------
  scanner:
    profiles: ["scan"]
    build:
      context: ./scanner
    depends_on:
      app:
        condition: service_healthy
    environment:
      ASPM_API: http://app:8080
      # Issued in the interface, then put here. Empty by default and NOT `:?` — a required-variable
      # marker on a service that is off by default makes every other compose command fail, including
      # `up app`, which is what it did the first time this ran. The loud failure belongs in the
      # container that needs the value: scan.sh refuses to start without it, which is the same
      # protection in the one place it does not block anything else.
      ASPM_SCAN_KEY_ID: ${SCAN_KEY_ID:-}
      ASPM_SCAN_SECRET: ${SCAN_SECRET:-}
      # How often it ASKS. How often anything is actually due is the dashboard's decision.
      SCAN_TICK_SECONDS: ${SCAN_TICK_SECONDS:-900}
    volumes:
      # The vulnerability database, kept across restarts. Without it every restart re-downloads
      # several hundred megabytes from ghcr.io, which is both slow and rude.
      - trivy-cache:/cache
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 192.168.246.0/24

volumes:
  trivy-cache:
  postgres-data:
  objectstore-data:
  gradle-cache:
