# Vietnamese — the first target locale (DOC-01 §4.3, DOC-08 §12).
#
# No ICU `plural` forms appear here, and their absence is correct rather than an unfinished
# translation: Vietnamese does not inflect nouns for number, so `{0} dòng` is right for every count.
# INT-UIX-008 requires ICU because plural rules DIFFER by language — a source bundle that needs
# plural and a target that does not is that requirement working, not a gap in it.

